
<!DOCTYPE html>
<html lang="ko">
    
<link rel="stylesheet" href="theme.css">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>CHARACTER MOTIF | DDONGGUR1 DREAM</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #080808;
            color: #f5f5f5;
            font-family: Arial, "Malgun Gothic", sans-serif;
        }

        .motif-page {
            width: min(1000px, 90%);
            margin: 0 auto 60px;
        }

        .cover {
            height: 260px;
            background: linear-gradient(transparent, #080808), #252525;
            border-bottom: 1px solid #333;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-top: -45px;
            position: relative;
        }

        .avatar {
            width: 140px;
            height: 140px;
            flex-shrink: 0;
            border-radius: 12px;
            background: #303039;
            border: 1px solid #555;
            object-fit: cover;
        }

        .name {
            margin: 0 0 8px;
            font-size: clamp(28px, 5vw, 46px);
            overflow-wrap: anywhere;
        }

        .subname {
            margin: 0;
            color: #aaa;
            font-size: 18px;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            color: #aaa;
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 2px;
        }

        .back:hover { color: white; }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-top: 55px;
        }

        .item { margin-bottom: 42px; }

        .item h2 {
            font-size: 18px;
            margin: 0 0 8px;
        }

        .item p {
            color: #aaa;
            margin: 0 0 12px;
            line-height: 1.7;
            font-size: 14px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .item img {
            display: block;
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 20px;
            background: #222;
        }

/* 음악 모티브 카드 */
.music-card {
    position: relative;
    min-height: 360px;
    padding: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
    border-radius: 24px;
    background: #222;
    margin-bottom: 42px;
}

/* 앨범 커버 배경 */
#music-cover {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* 음악 제목과 설명 */
.music-info {
    position: relative;
    z-index: 1;
    margin-top: auto;
    padding: 100px 24px 24px;
    color: white;
    background: linear-gradient(
        transparent,
        rgba(0, 0, 0, 0.88)
    );
}

.music-info h2 {
    margin: 0 0 12px;
    font-size: 22px;
    overflow-wrap: anywhere;
}

.music-info p {
    margin: 0;
    color: #eee;
    line-height: 1.7;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

/* 유튜브 플레이어 */
#music-player {
    position: relative;
    z-index: 2;
    width: 100%;
    background: #111;
}

#music-player iframe {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    border: 0;
}

/* 모바일 화면 */
@media (max-width: 650px) {
    .music-card {
        min-height: 300px;
    }
}
        .tags {
            margin-top: 45px;
            text-align: right;
            line-height: 2.5;
            color: #c9c9e8;
            font-style: italic;
            overflow-wrap: anywhere;
        }

        .footer {
            border-top: 1px solid #444;
            margin-top: 55px;
            padding-top: 18px;
            color: #777;
            font-size: 10px;
            letter-spacing: 2px;
        }

        @media (max-width: 650px) {
            .cover { height: 190px; }
            .header { gap: 16px; }
            .avatar { width: 95px; height: 95px; }
            .subname { font-size: 14px; }
            .content {
                grid-template-columns: 1fr;
                gap: 0;
                margin-top: 35px;
            }
            .music-card { min-height: 220px; }
        }
    </style>
</head>

<body>

<div class="theme-toggle">
    <button type="button" data-theme="light">☀ LIGHT</button>
    <button type="button" data-theme="dark">☾ DARK</button>
</div>

    <main class="motif-page">
        <div class="cover"></div>

        <header class="header">
            <img class="avatar" id="avatar" alt="캐릭터 이미지">
            <div>
                <h1 class="name" id="name">캐릭터 이름</h1>
                <p class="subname" id="subname">Character Motif Archive</p>
            </div>
        </header>

        <a class="back" id="back" href="index.html">← BACK TO PROFILE</a>

        <div class="content">
            <section>
                <article class="item">
                    <img id="person-image" alt="인물 모티브 이미지" hidden>
                </article>

                <article class="item">
                    <h2 id="work-title">VISUAL INSPIRATION / 시각적 영감</h2>
                    <p id="work-description">작품 모티브 설명이 등록되지 않았습니다.</p>
                    <img id="work-image" alt="작품 모티브 이미지" hidden>
                </article>

                <article class="item">
                    <h2>OTHER / 기타</h2>
                    <p id="other-description">기타 모티브 정보가 등록되지 않았습니다.</p>
                </article>
            </section>

            <section>
<!-- 음악 모티브 카드 -->
<article class="music-card" id="music-card">

    <!-- 앨범 커버 -->
    <img id="music-cover" alt="앨범 커버" hidden>

    <!-- 음악 제목과 설명 -->
    <div class="music-info">
        <h2 id="music-title">MUSIC ♫</h2>
        <p id="music-description">대표 음악이 등록되지 않았습니다.</p>
    </div>

    <!-- 유튜브 플레이어 -->
    <div id="music-player"></div>

</article>

                <div class="tags" id="tags"></div>
            </section>
        </div>

        <footer class="footer">MOTIF FILE · DDONGGUR1 DREAM</footer>
    </main>

<script src="./characters.js"></script>
<script>
// URL에서 캐릭터 ID 가져오기
const params = new URLSearchParams(location.search);
const id = params.get("id");
const character = window.characters.find(item => item.id === id);

    // 글자 표시
    function setText(elementId, value, fallback) {
        const element = document.getElementById(elementId);
        if (element) {
            element.textContent = value || fallback;
        }
    }

    // 이미지 표시
    function setImage(elementId, src, alt) {
        const img = document.getElementById(elementId);
        if (!img) return;

        if (!src) {
            img.hidden = true;
            return;
        }

        img.src = src;
        img.alt = alt;
        img.hidden = false;

        img.onerror = () => {
            img.hidden = true;
        };
    }

    if (character) {
        const motif = character.motif || {};

        // 캐릭터 기본 정보
        document.title = `${character.name} MOTIF | DDONGGUR1 DREAM`;
        setText("name", character.name, "이름 미등록");
        setText("subname", character.name, "Character Motif Archive");

        document.getElementById("back").href =
            `detail.html?id=${encodeURIComponent(character.id)}`;

        setImage("avatar", character.photo, "캐릭터 이미지");

        // 인물 모티브
        setImage("person-image", motif.personImage, "인물 모티브 이미지");

        // 작품 모티브
        setText("work-title", motif.work || "VISUAL INSPIRATION / 시각적 영감", "VISUAL INSPIRATION / 시각적 영감");
        setText("work-description", motif.workDescription, "작품 모티브 설명이 등록되지 않았습니다.");
        setImage("work-image", motif.workImage, "작품 모티브 이미지");

        // 기타 모티브
        setText("other-description", motif.other, "기타 모티브 정보가 등록되지 않았습니다.");

        // 음악 제목과 가수
        const musicTitle = [motif.music, motif.musicArtist]
            .filter(Boolean)
            .join(" — ");

        setText("music-title", musicTitle || "MUSIC ♫", "MUSIC ♫");
        setText("music-description", motif.musicDescription, "대표 음악이 등록되지 않았습니다.");

        // 앨범 커버
        setImage("music-cover", motif.musicCover, "앨범 커버");

        // 유튜브 플레이어
        const musicPlayer = document.getElementById("music-player");
        musicPlayer.replaceChildren();

        if (motif.musicVideoId) {
            const iframe = document.createElement("iframe");

            iframe.src =
                `https://www.youtube-nocookie.com/embed/${encodeURIComponent(motif.musicVideoId)}?autoplay=1&mute=1&playsinline=1`;

            iframe.title = `${character.name}의 모티브 음악`;
            iframe.allow = "autoplay; encrypted-media; picture-in-picture";
            iframe.allowFullscreen = true;

            musicPlayer.appendChild(iframe);
        }

        // 해시태그
        const tags = Array.isArray(motif.tags) ? motif.tags : [];
        document.getElementById("tags").textContent =
            tags.map(tag => `#${String(tag).replace(/^#+/, "")}`).join("\n");

    } else {
        setText("name", "캐릭터를 찾을 수 없습니다.", "");
        setText("subname", "목록에서 캐릭터를 선택해 주세요.", "");
        document.getElementById("back").href = "index.html";
    }
</script>
<script src="theme.js"></script>
</body>
</html>

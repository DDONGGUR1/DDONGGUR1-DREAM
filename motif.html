
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>CHARACTER MOTIF | DDONGGUR1 DREAM</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #080808;
            color: #f5f5f5;
            font-family: Arial, "Malgun Gothic", sans-serif;
        }

        .motif-page {
            width: min(1000px, 90%);
            margin: 0 auto 60px;
        }

        .cover {
            height: 260px;
            background: linear-gradient(transparent, #080808), #252525;
            border-bottom: 1px solid #333;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-top: -45px;
            position: relative;
        }

        .avatar {
            width: 140px;
            height: 140px;
            flex-shrink: 0;
            border-radius: 12px;
            background: #303039;
            border: 1px solid #555;
            object-fit: cover;
        }

        .name {
            margin: 0 0 8px;
            font-size: clamp(28px, 5vw, 46px);
            overflow-wrap: anywhere;
        }

        .subname {
            margin: 0;
            color: #aaa;
            font-size: 18px;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            color: #aaa;
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 2px;
        }

        .back:hover { color: white; }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-top: 55px;
        }

        .item { margin-bottom: 42px; }

        .item h2 {
            font-size: 18px;
            margin: 0 0 8px;
        }

        .item p {
            color: #aaa;
            margin: 0 0 12px;
            line-height: 1.7;
            font-size: 14px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .item img {
            display: block;
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 20px;
            background: #222;
        }

        .music-card {
            min-height: 260px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            border-radius: 24px;
            background: linear-gradient(transparent, #25252b), #45454b;
            margin-bottom: 42px;
        }

        .music-card h2 { font-size: 22px; }

        .music-card p {
            color: #ddd;
            line-height: 1.7;
            white-space: pre-wrap;
        }

        .tags {
            margin-top: 45px;
            text-align: right;
            line-height: 2.5;
            color: #c9c9e8;
            font-style: italic;
            overflow-wrap: anywhere;
        }

        .footer {
            border-top: 1px solid #444;
            margin-top: 55px;
            padding-top: 18px;
            color: #777;
            font-size: 10px;
            letter-spacing: 2px;
        }

        @media (max-width: 650px) {
            .cover { height: 190px; }
            .header { gap: 16px; }
            .avatar { width: 95px; height: 95px; }
            .subname { font-size: 14px; }
            .content {
                grid-template-columns: 1fr;
                gap: 0;
                margin-top: 35px;
            }
            .music-card { min-height: 220px; }
        }
    </style>
</head>

<body>
    <main class="motif-page">
        <div class="cover"></div>

        <header class="header">
            <img class="avatar" id="avatar" alt="캐릭터 이미지">
            <div>
                <h1 class="name" id="name">캐릭터 이름</h1>
                <p class="subname" id="subname">Character Motif Archive</p>
            </div>
        </header>

        <a class="back" id="back" href="index.html">← BACK TO PROFILE</a>

        <div class="content">
            <section>
                <article class="item">
                    <img id="person-image" alt="인물 모티브 이미지" hidden>
                </article>

                <article class="item">
                    <h2 id="work-title">VISUAL INSPIRATION / 시각적 영감</h2>
                    <p id="work-description">작품 모티브 설명이 등록되지 않았습니다.</p>
                    <img id="work-image" alt="작품 모티브 이미지" hidden>
                </article>

                <article class="item">
                    <h2>OTHER / 기타</h2>
                    <p id="other-description">기타 모티브 정보가 등록되지 않았습니다.</p>
                </article>
            </section>

            <section>
                <article class="music-card">
                    <h2 id="music-title">MUSIC ♫</h2>
                    <p id="music-description">대표 음악이 등록되지 않았습니다.</p>
                </article>

                <div class="tags" id="tags"></div>
            </section>
        </div>

        <footer class="footer">MOTIF FILE · DDONGGUR1 DREAM</footer>
    </main>

    <script src="characters.js"></script>
    <script>
        const params = new URLSearchParams(location.search);
        const id = params.get("id");
        const character = characters.find(item => item.id === id);

        function setText(elementId, value, fallback) {
            document.getElementById(elementId).textContent =
                value || fallback;
        }

        function setImage(elementId, src, alt) {
            const img = document.getElementById(elementId);

            if (!src) {
                img.hidden = true;
                return;
            }

            img.src = src;
            img.alt = alt;
            img.hidden = false;

            img.addEventListener("error", () => {
                img.hidden = true;
            }, { once: true });
        }

        if (character) {
            const motif = character.motif || {};

            document.title = `${character.name} MOTIF | DDONGGUR1 DREAM`;
            setText("name", character.name, "이름 미등록");
            setText("subname", character.name, "Character Motif Archive");
            document.getElementById("back").href =
                `detail.html?id=${encodeURIComponent(character.id)}`;

            setImage("avatar", character.photo, `${character.name} 이미지`);
            setText("person-title", motif.person || "PERSON / 인물", "PERSON / 인물");
            setText("person-description", motif.personDescription, "인물 모티브 설명이 등록되지 않았습니다.");
            setImage("person-image", motif.personImage, "인물 모티브 이미지");

            setText("work-title", motif.work || "WORK / 작품", "WORK / 작품");
            setText("work-description", motif.workDescription, "작품 모티브 설명이 등록되지 않았습니다.");
            setImage("work-image", motif.workImage, "작품 모티브 이미지");

            setText("other-description", motif.other, "기타 모티브 정보가 등록되지 않았습니다.");

            const musicTitle = [motif.music, motif.musicArtist]
                .filter(Boolean)
                .join(" — ");

            setText("music-title", musicTitle || "MUSIC ♫", "MUSIC ♫");
            setText("music-description", motif.musicDescription, "대표 음악이 등록되지 않았습니다.");

            const tags = Array.isArray(motif.tags) ? motif.tags : [];
            document.getElementById("tags").textContent =
                tags.map(tag => `#${String(tag).replace(/^#+/, "")}`).join("\n");
        } else {
            setText("name", "캐릭터를 찾을 수 없습니다.", "");
            setText("subname", "목록에서 캐릭터를 선택해 주세요.", "");
            document.getElementById("back").href = "index.html";
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHARACTER PROFILE | DDONGGUR1 DREAM</title>
    <link rel="icon" type="image/png" href="favi.png">

    <!-- 상세 페이지 스타일 -->
    <style>
        /* 기본 박스 크기 설정 */
        * {
            box-sizing: border-box;
        }

        /* 페이지 기본 스타일 */
        body {
            margin: 0;
            background: #fff;
            color: #222;
            font-family: Arial, "Malgun Gothic", sans-serif;
        }

        /* 상세 페이지 전체 너비와 여백 */
        .detail-page {
            width: min(1100px, 90%);
            margin: 55px auto;
        }

        /* 상단 제목 영역 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 35px;
            padding-bottom: 12px;
            border-bottom: 1px solid #ccc;
            color: #777;
            font-size: 10px;
            letter-spacing: 2px;
        }

        /* 목록 페이지로 돌아가는 링크 */
        .back-link {
            color: #555;
            text-decoration: none;
            letter-spacing: 1px;
        }

        .back-link:hover {
            color: #000;
            text-decoration: underline;
        }

        /* 초상화와 정보의 2열 레이아웃 */
        .profile-layout {
            display: grid;
            grid-template-columns: minmax(260px, 0.8fr) minmax(0, 1.2fr);
            align-items: start;
            gap: clamp(30px, 6vw, 80px);
        }

        .portrait-area {
            min-width: 0;
        }

        .portrait-label {
            margin: 0 0 12px;
            font-size: 11px;
            color: #777;
            letter-spacing: 1px;
        }

        /* 초상화 테두리 영역 */
        .portrait-frame {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 240px;
            padding: 12px;
            border: 1px solid #ccc;
            background: #f5f5f2;
        }

        .portrait-frame img {
            display: block;
            max-width: 100%;
            max-height: 75vh;
            width: auto;
            height: auto;
            object-fit: contain;
            object-position: top center;
        }

        .portrait-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 240px;
            color: #888;
            font-size: 11px;
            letter-spacing: 2px;
        }

        /* 캐릭터 정보 영역 */
        .info-area {
            padding-top: 35px;
            min-width: 0;
        }

        .info-label {
            margin: 0 0 12px;
            color: #777;
            font-size: 10px;
            letter-spacing: 2px;
        }

        /* 캐릭터 이름 */
        .character-name {
            margin: 0;
            padding-bottom: 18px;
            border-bottom: 1px solid #222;
            font-size: clamp(30px, 5vw, 48px);
            font-weight: normal;
            overflow-wrap: anywhere;
        }

        /* 정보 항목별 간격 */
        .info-section {
            margin-top: 28px;
        }

        .info-section h2 {
            margin: 0 0 12px;
            font-size: 12px;
            font-weight: normal;
            color: #777;
        }

        .info-section p {
            margin: 0;
            font-size: 14px;
            line-height: 2;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        /* 페이지 하단 문구 */
        .bottom-note {
            margin-top: 55px;
            padding-top: 12px;
            border-top: 1px solid #ccc;
            color: #888;
            font-size: 9px;
            letter-spacing: 1.5px;
        }

        /* 모바일 화면 대응 */
        @media (max-width: 650px) {
            .detail-page {
                margin: 28px auto;
            }

            .profile-layout {
                grid-template-columns: 1fr;
                gap: 28px;
            }

            .portrait-frame {
                min-height: 180px;
            }

            .portrait-frame img {
                max-height: 70vh;
            }

            .info-area {
                padding-top: 0;
            }

            .info-section {
                margin-top: 22px;
            }
        }
    </style>
</head>
<body>
    <!-- 상세 프로필 페이지 본문 -->
    <main class="detail-page">
        <!-- 상단 제목과 목록 복귀 링크 -->
        <header class="top-bar">
            <span>DDONGGUR1 DREAM</span>
            <a class="back-link" href="index.html">← BACK TO LIST</a>
        </header>

        <!-- 초상화와 인적 사항 배치 -->
        <div class="profile-layout">
            <!-- 왼쪽: 캐릭터 초상화 -->
            <section class="portrait-area">
                <p class="portrait-label">CHARACTER PORTRAIT</p>
                <div class="portrait-frame" id="portrait-frame">
                    <div class="portrait-placeholder">PORTRAIT</div>
                </div>
            </section>

            <!-- 오른쪽: 캐릭터 정보 -->
            <section class="info-area">
                <p class="info-label">PERSONAL INFORMATION</p>
                <h1 class="character-name" id="character-name">캐릭터 이름</h1>

                <div class="info-section">
                    <!-- 나이 정보 -->
                    <h2>AGE / 나이</h2>
                    <p id="character-age">나이</p>
                </div>

                <div class="info-section">
                    <!-- 스탠드 정보 -->
                    <h2>STAND / 스탠드</h2>
                    <p id="character-stand">스탠드</p>
                </div>

                <div class="info-section">
                    <!-- 짧은 설명 -->
                    <h2>SHORT DESCRIPTION / 짧은 설명</h2>
                    <p id="character-intro">짧은 설명</p>
                </div>

                <div class="info-section">
                    <!-- 자세한 설명 -->
                    <h2>DETAILED DESCRIPTION / 자세한 설명</h2>
                    <p id="character-description">자세한 설명</p>
                </div>
            </section>
        </div>

        <!-- 페이지 하단 표기 -->
        <footer class="bottom-note">CHARACTER FILE · DDONGGUR1 DREAM</footer>
    </main>

    <!-- 캐릭터 데이터와 상세 페이지 표시 로직 -->
    <script src="characters.js"></script>
    <script>
        // URL에서 표시할 캐릭터 ID 확인
        const params = new URLSearchParams(window.location.search);
        const characterId = params.get("id");
        const character = characters.find(item => item.id === characterId);

        // 화면 요소 연결
        const nameElement = document.getElementById("character-name");
        const ageElement = document.getElementById("character-age");
        const standElement = document.getElementById("character-stand");
        const introElement = document.getElementById("character-intro");
        const descriptionElement = document.getElementById("character-description");
        const portraitFrame = document.getElementById("portrait-frame");

        // 캐릭터 정보가 존재하면 화면에 표시
        if (character) {
            document.title = `${character.name} | DDONGGUR1 DREAM`;
            nameElement.textContent = character.name;
            ageElement.textContent = character.age || "나이 미등록";
            standElement.textContent = character.stand || "스탠드 미등록";
            introElement.textContent = character.intro || "짧은 설명이 등록되지 않았습니다.";
            descriptionElement.textContent = character.description || "자세한 설명이 등록되지 않았습니다.";

            // 초상화 이미지 생성 및 로드 실패 처리
            if (character.photo) {
                const image = document.createElement("img");
                image.src = character.photo;
                image.alt = `${character.name}의 초상화`;

                image.addEventListener("error", () => {
                    portraitFrame.replaceChildren();
                    const placeholder = document.createElement("div");
                    placeholder.className = "portrait-placeholder";
                    placeholder.textContent = "IMAGE NOT FOUND";
                    portraitFrame.appendChild(placeholder);
                });

                portraitFrame.replaceChildren(image);
            }
        // 해당 ID의 캐릭터가 없을 때 안내 표시
        else {
            nameElement.textContent = "캐릭터를 찾을 수 없습니다.";
            ageElement.textContent = "";
            standElement.textContent = "";
            introElement.textContent = "";
            descriptionElement.textContent = "목록 페이지에서 캐릭터를 선택해 다시 들어와 주세요.";
        }
    </script>
</body>
</html>

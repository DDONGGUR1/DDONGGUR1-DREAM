
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHARACTER PROFILE | DDONGGUR1 DREAM</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #fff;
            color: #222;
            font-family: Arial, "Malgun Gothic", sans-serif;
        }

        .detail-page {
            width: min(1100px, 90%);
            margin: 55px auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 35px;
            padding-bottom: 12px;
            border-bottom: 1px solid #ccc;
            color: #777;
            font-size: 10px;
            letter-spacing: 2px;
        }

        .back-link {
            color: #555;
            text-decoration: none;
            letter-spacing: 1px;
        }

        .back-link:hover {
            color: #000;
            text-decoration: underline;
        }

        .profile-layout {
            display: grid;
            grid-template-columns: minmax(260px, 0.8fr) minmax(0, 1.2fr);
            align-items: start;
            gap: clamp(30px, 6vw, 80px);
        }

        .portrait-area {
            min-width: 0;
        }

        .portrait-label {
            margin: 0 0 12px;
            font-size: 11px;
            color: #777;
            letter-spacing: 1px;
        }

        .portrait-frame {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 240px;
            padding: 12px;
            border: 1px solid #ccc;
            background: #f5f5f2;
        }

        .portrait-frame img {
            display: block;
            max-width: 100%;
            max-height: 75vh;
            width: auto;
            height: auto;
            object-fit: contain;
            object-position: top center;
        }

        .portrait-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 240px;
            color: #888;
            font-size: 11px;
            letter-spacing: 2px;
        }

        .info-area {
            padding-top: 35px;
            min-width: 0;
        }

        .info-label {
            margin: 0 0 12px;
            color: #777;
            font-size: 10px;
            letter-spacing: 2px;
        }

        .character-name {
            margin: 0;
            padding-bottom: 18px;
            border-bottom: 1px solid #222;
            font-size: clamp(30px, 5vw, 48px);
            font-weight: normal;
            overflow-wrap: anywhere;
        }

        .info-section {
            margin-top: 28px;
        }

        .info-section h2 {
            margin: 0 0 12px;
            font-size: 12px;
            font-weight: normal;
            color: #777;
        }

        .info-section p {
            margin: 0;
            font-size: 14px;
            line-height: 2;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .bottom-note {
            margin-top: 55px;
            padding-top: 12px;
            border-top: 1px solid #ccc;
            color: #888;
            font-size: 9px;
            letter-spacing: 1.5px;
        }

        @media (max-width: 650px) {
            .detail-page {
                margin: 28px auto;
            }

            .profile-layout {
                grid-template-columns: 1fr;
                gap: 28px;
            }

            .portrait-frame {
                min-height: 180px;
            }

            .portrait-frame img {
                max-height: 70vh;
            }

            .info-area {
                padding-top: 0;
            }

            .info-section {
                margin-top: 22px;
            }
        }
    </style>
</head>
<body>
    <main class="detail-page">
        <header class="top-bar">
            <span>JOJO DREAM ARCHIVE</span>
            <a class="back-link" href="index.html">← BACK TO LIST</a>
        </header>

        <div class="profile-layout">
            <section class="portrait-area">
                <p class="portrait-label">CHARACTER PORTRAIT</p>
                <div class="portrait-frame" id="portrait-frame">
                    <div class="portrait-placeholder">PORTRAIT</div>
                </div>
            </section>

            <section class="info-area">
                <p class="info-label">PERSONAL INFORMATION</p>
                <h1 class="character-name" id="character-name">캐릭터 이름</h1>

                <div class="info-section">
                    <h2>AGE / FEATURES</h2>
                    <p id="character-age">나이 및 특징</p>
                </div>

                <div class="info-section">
                    <h2>DESCRIPTION</h2>
                    <p id="character-description">캐릭터 설명</p>
                </div>
            </section>
        </div>

        <footer class="bottom-note">CHARACTER FILE · JOJO DREAM ARCHIVE</footer>
    </main>


<script src="characters.js"></script>
<script>
    const params = new URLSearchParams(window.location.search);
    const characterId = params.get("id");

    const character = characters.find(item => item.id === characterId);

    const nameElement = document.getElementById("character-name");
    const ageElement = document.getElementById("character-age");
    const descriptionElement = document.getElementById("character-description");
    const portraitFrame = document.getElementById("portrait-frame");

    if (character) {
        document.title = `${character.name} | JOJO DREAM ARCHIVE`;
        nameElement.textContent = character.name;

        ageElement.textContent = [
            character.age,
            character.features
        ].filter(Boolean).join(" · ") || "등록된 정보가 없습니다.";

        descriptionElement.textContent =
            character.description || character.intro || "등록된 설명이 없습니다.";

        if (character.photo) {
            const image = document.createElement("img");
            image.src = character.photo;
            image.alt = `${character.name}의 초상화`;

            image.addEventListener("error", () => {
                portraitFrame.replaceChildren();

                const placeholder = document.createElement("div");
                placeholder.className = "portrait-placeholder";
                placeholder.textContent = "IMAGE NOT FOUND";

                portraitFrame.appendChild(placeholder);
            });

            portraitFrame.replaceChildren(image);
        }
    } else {
        nameElement.textContent = "캐릭터를 찾을 수 없습니다.";
        ageElement.textContent = "";
        descriptionElement.textContent =
            "목록 페이지에서 캐릭터를 선택해 다시 들어와 주세요.";
    }
</script>

</body>
</html>
